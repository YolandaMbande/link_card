<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yolanda Mbande | My Links</title>
  <meta name="description" content="Yolanda Mbande's links and social profiles">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* PROFILE */

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .profile-image {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 14px;
      border: 3px solid #f90eda;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .profile-bio {
      font-size: 14px;
      color: #555;
      max-width: 400px;
      line-height: 1.5;
    }

    /* LINKS */

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      position: relative;
      width: 100%;
      min-height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px 55px 14px 55px;

      background: #ffffff;
      color: #111;
      text-decoration: none;

      border: 1px solid #e5e5e5;
      border-radius: 12px;

      font-size: 15px;
      font-weight: 600;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .link:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
      background: #fafafa;
    }

    .link:active {
      transform: translateY(0);
    }

    /* ICON */

    .link-icon {
      position: absolute;
      left: 18px;

      width: 28px;
      height: 28px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 19px;
    }

      /* THREE DOTS */

      .link-menu {
        position: absolute;
        right: 18px;

        width: 28px;
        height: 28px;

        display: flex;
        align-items: center;
        justify-content: center;

        color: #777;
        font-size: 18px;
      }

      /* SOCIAL ICONS */

      .socials {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin-top: 30px;
      }

      .socials a {
        color: #222;
        font-size: 21px;
        text-decoration: none;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .socials a:hover {
        transform: scale(1.1);
        opacity: 0.65;
      }

      /* FOOTER */

      .footer {
        margin-top: 30px;
        font-size: 12px;
        color: #888;
        text-align: center;
      }

      /* MOBILE */

      @media (max-width: 600px) {

        body {
          padding: 24px 14px;
        }

        .profile {
          margin-bottom: 24px;
        }

        .profile-image {
          width: 88px;
          height: 88px;
        }

        .profile-name {
          font-size: 19px;
        }

        .profile-bio {
          font-size: 13px;
        }

        .link {
          min-height: 58px;
          font-size: 14px;
          border-radius: 10px;
        }
      }
      /* THEME TOGGLE */

  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;

    width: 42px;
    height: 42px;

    border: none;
    border-radius: 50%;

    background: #ffffff;
    color: #222;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;

    cursor: pointer;

    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);

    transition:
      background 0.3s ease,
      color 0.3s ease,
      transform 0.2s ease;
  }

  .theme-toggle:hover {
    transform: scale(1.05);
  }


  /* DARK MODE */

  body.dark-mode {
    background: #111111;
    color: #ffffff;
  }

  body.dark-mode .profile-bio {
    color: #aaaaaa;
  }

  body.dark-mode .link {
    background: #ec7fda;
    border-color: #2c2c2c;
    color: #ffffff;
  }

  body.dark-mode .link:hover {
    background: #eb04b9;
  }

  body.dark-mode .link-menu {
    color: #aaaaaa;
  }

  body.dark-mode .socials a {
    color: #ffffff;
  }

  body.dark-mode .footer {
    color: #777777;
  }

  body.dark-mode .theme-toggle {
    background: #242424;
    color: #ffffff;
  }
  </style>
</head>

<body>

  <div class="container">

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <i class="bi bi-moon-fill"></i>
    </button>
    <!-- PROFILE -->
    <header class="profile">

      <img
        class="profile-image"
        src="images/profile.jpg"
        alt="Yolanda Mbande"
      >

      <h1 class="profile-name">
        Yolanda Mbande
      </h1>

      <p class="profile-bio">
        Software Developer · Cape Town, South Africa
      </p>

    </header>


    <!-- LINKS -->
    <main class="links">

      <!-- WEBSITE -->
      <a
        class="link"

        rel="noopener noreferrer"
      >
        <span class="link-icon">
          <i class="bi bi-globe2" style="color: #f90eda;"></i>
        </span>

        <span>
          My Website
        </span>

        <span class="link-menu">
          <i class="bi bi-three-dots"></i>
        </span>
      </a>

      <a
        class="link"
        href="https://substack.com/@mindgardenart"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon">
          <i class="bi bi-substack" style="color: #f90eda;"></i>
        </span>

        <span>
          Substack
        </span>

        <span class="link-menu">
          <i class="bi bi-three-dots"></i>
        </span>
      </a>


      <!-- FACEBOOK -->
      <a
        class="link"
        href="https://web.facebook.com/mslandie.mbande.9"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon">
          <i class="bi bi-facebook" style="color: #f90eda;"></i>
        </span>

        <span>
          Facebook
        </span>

        <span class="link-menu">
          <i class="bi bi-three-dots" style="color: #f90eda;"></i>
        </span>
      </a>


      <!-- GITHUB -->
      <a
        class="link"
        href="https://hashnode.com/@mbandes"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="link-icon">
          <i class="fa-brands fa-hashnode" style="color: #f90eda;"></i>
        </span>

        <span>
          Hashnode
        </span>

        <span class="link-menu">
          <i class="bi bi-three-dots"></i>
        </span>
      </a>


      <!-- EMAIL -->
      <a
        class="link"
        href="https://x.com/yolanda__mbande"
      >
        <span class="link-icon">
          <i class="bi bi-twitter-x" style="color: #f90eda;"></i>
        </span>

        <span>
          X
        </span>

        <span class="link-menu">
          <i class="bi bi-three-dots"></i>
        </span>
      </a>

    </main>


    <!-- SOCIAL ICONS -->
    <div class="socials">

      <a
        href="https://www.instagram.com/mbande_yolanda"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
      >
        <i class="bi bi-instagram" style="color: #f90eda;"></i>
      </a>

      <a
        href="https://github.com/YolandaMbande"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
      >
        <i class="bi bi-github" style="color: #f90eda;"></i>
      </a>

      <a
        href="mailto:y_mbande@icloud.com"
        aria-label="Email"
      >
        <i class="bi bi-envelope" style="color: #f90eda;"></i>
      </a>

    </div>


    <!-- FOOTER -->
    <footer class="footer">
      © 2026 Yolanda Mbande
    </footer>

  </div>

  <script>
  const themeToggle = document.getElementById("themeToggle");

  themeToggle.addEventListener("click", function () {
    document.body.classList.toggle("dark-mode");

    const icon = themeToggle.querySelector("i");

    if (document.body.classList.contains("dark-mode")) {
      icon.classList.remove("bi-moon-fill");
      icon.classList.add("bi-sun-fill");
    } else {
      icon.classList.remove("bi-sun-fill");
      icon.classList.add("bi-moon-fill");
    }
  });
</script>
</body>
</html>
